name: Build and Security Scan

on:
  push:
    branches:
      - main
      - master
      - trivy
  pull_request:

jobs:
  build-and-scan:
    name: Build Image and Run Trivy Scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and populate Maven cache
        run: |
          mvn -B clean package -DskipTests
      
      - name: Verify OpenSearch dependency
        run: |
          find ~/.m2/repository/org/open-metadata/opensearch-deps/2.0.0 -type f -print
      
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: template
          template: ./intech-html.tpl
          output: trivy-results.html
          skip-dirs: ingestion/src/metadata/data_quality/data
