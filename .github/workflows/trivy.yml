name: Security Scan

on:
  push:
    branches:
      - main
      - master
      - trivy
  pull_request:

jobs:
  security-scan:
    name: Maven Dependency Scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      # Download all dependencies and POM files.
      # This does NOT compile or build the project.
      - name: Populate Maven cache
        run: |
          mvn -B dependency:go-offline

      # Verify the Maven artifacts required by Trivy.
      - name: Verify Maven cache
        run: |
          echo "Checking OpenMetadata Maven artifacts..."

          find "$HOME/.m2/repository/org/open-metadata" \
            -type f \
            | sort \
            | head -200

          echo ""
          echo "Checking platform 2.0.0..."

          if [ ! -f \
            "$HOME/.m2/repository/org/open-metadata/platform/2.0.0/platform-2.0.0.pom"
          ]; then
            echo "::error::platform-2.0.0.pom is missing from Maven cache"
            exit 1
          fi

          echo "platform-2.0.0.pom found."

      # Run Trivy without secret scanning.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        env:
          MAVEN_OPTS: "-Dmaven.repo.local=$HOME/.m2/repository"
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: template
          template: ./intech-html.tpl
          output: trivy-results.html
          skip-dirs: ingestion/src/metadata/data_quality/data
