name: Security Scan

on:
  push:
    branches:
      - main
      - master
      - trivy
  pull_request:

jobs:
  security-scan:
    name: Resolve Dependencies and Run Trivy Scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      # Télécharge les dépendances Maven dans ~/.m2
      # sans compiler ni construire de JAR.
      - name: Resolve Maven dependencies
        run: |
          mvn -B dependency:resolve

      # Vérifie que la dépendance qui provoquait le 429
      # est bien présente dans le cache local.
      - name: Verify OpenSearch dependency
        run: |
          DEP_PATH="$HOME/.m2/repository/org/open-metadata/opensearch-deps/2.0.0"

          if [ ! -d "$DEP_PATH" ]; then
            echo "::error::OpenSearch dependency not found in Maven cache"
            exit 1
          fi

          echo "OpenSearch dependency found:"
          find "$DEP_PATH" -type f -print

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: template
          template: ./intech-html.tpl
          output: trivy-results.html
          skip-dirs: ingestion/src/metadata/data_quality/data
