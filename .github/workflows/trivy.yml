name: Build and Security Scan

on:
  push:
    branches:
      - main
      - master
      - trivy
  pull_request:

jobs:
  build-and-scan:
    name: Build Image and Run Trivy Scan
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # setup-java's Maven cache is already configured above.
      # Resolve dependencies only if your build actually needs this.
      - name: Resolve Maven dependencies
        run: mvn -B dependency:go-offline
        continue-on-error: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: template
          template: ./intech-html.tpl
          output: trivy-results.html
          skip-dirs: ingestion/src/metadata/data_quality/data
